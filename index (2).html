function extractJSON(text){
  try{return JSON.parse(text.trim());}catch(e){}
  const m=text.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){}}
  throw new Error("Could not parse response");
}

async function callAI(sys,msg,onChunk){
  const r=await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_KEY}`},
    body:JSON.stringify({model:"llama3-8b-8192",max_tokens:2000,stream:true,temperature:0.3,messages:[{role:"system",content:sys},{role:"user",content:msg}]})});
  if(!r.ok)throw new Error("API error "+r.status);
  const reader=r.body.getReader();const dec=new TextDecoder();let full="";
  while(true){const{done,value}=await reader.read();if(done)break;
    for(const line of dec.decode(value).split("\n")){
      if(line.startsWith("data:")){const d=line.slice(5).trim();if(d==="[DONE]")break;
        try{const j=JSON.parse(d);const c=j.choices?.[0]?.delta?.content;if(c){full+=c;if(onChunk)onChunk(full);}}catch(e){}
      }
    }
  }
  return full;
}

// Notification system
function scheduleNotification(label,time){
  if(!("Notification" in window))return;
  if(Notification.permission!=="granted"){Notification.requestPermission();return;}
  const[h,m]=time.split(":").map(Number);
  const now=new Date();const target=new Date();
  target.setHours(h,m,0,0);
  if(target<=now)target.setDate(target.getDate()+1);
  const delay=target-now;
  setTimeout(()=>{
    new Notification("Build Your Muscles ✝️",{body:`Time for: ${label}`,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C9A84C'/><text y='.9em' font-size='70' x='15'>💪</text></svg>"});
  },delay);
}

function BMIChart({updates,currentBMI}){
  const profile=JSON.parse(localStorage.getItem("bym_profile")||"{}");
  const hM=profile.height?(+profile.height/100):null;
  let pts=updates.filter(u=>u.weight&&hM).map(u=>({date:u.date,bmi:+(+u.weight/(hM*hM)).toFixed(1)}));
  if(pts.length===0&&currentBMI)pts=[{date:"Now",bmi:currentBMI}];
  if(!pts.length)return null;
  const vals=pts.map(p=>p.bmi),minV=Math.min(...vals,16),maxV=Math.max(...vals,33),range=maxV-minV||1;
  const W=520,H=100,PL=32,PR=12,PT=18,PB=20;
  const cx=i=>PL+(i/Math.max(pts.length-1,1))*(W-PL-PR);
  const cy=v=>PT+(1-(v-minV)/range)*(H-PT-PB);
  const bc=b=>b<18.5?"#378ADD":b<25?"#6aaa3a":b<30?GOLD:"#E24B4A";
  return(
    <GCard style={{marginBottom:14}}>
      <GoldLabel>BMI PROGRESS CHART</GoldLabel>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
        {[18.5,25,30].map(v=><g key={v}><line x1={PL} y1={cy(v)} x2={W-PR} y2={cy(v)} stroke="#1e1e1e" strokeWidth="1" strokeDasharray="4,4"/><text x={PL-4} y={cy(v)} textAnchor="end" dominantBaseline="middle" fontSize="9" fill="#444">{v}</text></g>)}
        {pts.length>1&&<polyline fill="none" stroke={GOLD} strokeWidth="2" strokeLinejoin="round" points={pts.map((p,i)=>`${cx(i)},${cy(p.bmi)}`).join(" ")}/>}
        {pts.map((p,i)=><g key={i}><circle cx={cx(i)} cy={cy(p.bmi)} r={5} fill={bc(p.bmi)} stroke="#080808" strokeWidth="2"/><text x={cx(i)} y={cy(p.bmi)-10} textAnchor="middle" fontSize="9" fill={bc(p.bmi)} fontWeight="700">{p.bmi}</text><text x={cx(i)} y={H-3} textAnchor="middle" fontSize="8" fill="#333">{(p.date||"").split(" ").slice(0,2).join(" ")}</text></g>)}
      </svg>
      <div style={{display:"flex",gap:12,marginTop:6,flexWrap:"wrap"}}>
        {[["#378ADD","Underweight"],["#6aaa3a","Healthy"],["#C9A84C","Overweight"],["#E24B4A","Obese"]].map(([c,l])=><div key={l} style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:8,height:8,borderRadius:"50%",background:c}}/><span style={{fontSize:10,color:"#444"}}>{l}</span></div>)}
      </div>
    </GCard>
  );
}

      onResult(type);

function Achievements({plan,updates,chatCount}){
  const unlocked=[];
  if(plan)unlocked.push("first_plan");
  if(updates.length>=7)unlocked.push("week_1");
  if(updates.length>=1&&+updates[updates.length-1].weight<+updates[0].weight)unlocked.push("weight_loss");
  if(chatCount>=10)unlocked.push("chat_10");
  const readGuides=JSON.parse(localStorage.getItem("bym_guide_read")||"[]");
  if(readGuides.length>=BEGINNER_GUIDE.length)unlocked.push("guide_complete");
  return(
    <div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:9,color:GOLD,letterSpacing:"2px",marginBottom:6}}>YOUR WINS</div>
        <h1 style={{fontSize:22,fontWeight:800,color:"#f0e8d8",fontFamily:"Georgia,serif"}}>Achievements</h1>

      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {ACHIEVEMENTS.map(a=>{
          const got=unlocked.includes(a.id);

            <div key={a.id} style={{background:got?"#0d0900":"#0a0a0a",border:`1px solid ${got?GOLD+"44":"#1a1a1a"}`,borderRadius:12,padding:"16px 14px",textAlign:"center",opacity:got?1:.5,transition:"all .3s"}}>
              <div style={{fontSize:32,marginBottom:8,filter:got?"none":"grayscale(1)"}}>{a.icon}</div>

  );

    if(!chatIn.trim()||chatLoad)return;

    setMsgs(m=>[...m,{role:"user",text:q},{role:"ai",text:""}]);
    setChatLoad(true);
    const newCount=chatCount+1;setChatCount(newCount);localStorage.setItem("bym_chat_count",String(newCount));
    try{await callAI(buildSys(),q,(t)=>setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:t}]));}
    catch(e){setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:"Connection error. Please try again!"}]);}
    setChatLoad(false);
  }

  function saveUpdate(){
    if(!upForm.weight)return;
    const e={...upForm,date:new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}),ts:Date.now()};
    const nu=[...updates,e];setUpdates(nu);
    localStorage.setItem("bym_updates",JSON.stringify(nu));
    setUpForm({weight:"",waist:"",chest:"",energy:"Medium",days:""});
  }

  const TABS=[["home","🏠","Home"],["profile","👤","Profile"],["plan","📋","Plan"],["daily","📅","Daily"],["more","⚡","More"]];

  return(
    <div style={{minHeight:"100vh",background:"#080808"}}>
      {/* TOP HEADER */}

          <CrossIcon/>

      </div>

      {/* MOBILE BOTTOM NAV */}

        {TABS.map(([id,ic,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",padding:"6px 2px",color:tab===id?GOLD:"#444"}}>
            <span style={{fontSize:20}}>{ic}</span>
            <span style={{fontSize:10,fontWeight:tab===id?700:400}}>{lb}</span>
          </button>

      <div className="page-pad" style={{maxWidth:860,margin:"0 auto",padding:"16px 16px 24px"}}>

      {/* ===== HOME ===== */}
      {tab==="home"&&(
        <div className="fade-up">
          {/* Faith Banner */}
          <div style={{textAlign:"center",padding:"8px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <CrossIcon/>
            <span style={{fontSize:11,color:"#444",letterSpacing:"1px",fontStyle:"italic"}}>"I can do all things through Christ who strengthens me." — Phil 4:13</span>
            <CrossIcon/>
          </div>

          <QuoteBanner quote={QUOTES[qIdx]} onNext={()=>setQIdx(i=>(i+1)%QUOTES.length)}/>

          {/* Hero */}
          <div style={{position:"relative",background:"linear-gradient(135deg,#0d0a00,#0a0800)",border:`1px solid ${GOLD}20`,borderRadius:16,padding:"22px 24px",marginBottom:14,overflow:"hidden"}}>
            <div style={{position:"absolute",right:16,top:"50%",transform:"translateY(-50%)",fontSize:70,opacity:.04}}>💪</div>
            <div style={{position:"relative",zIndex:1}}>
              <div style={{fontSize:9,color:GOLD,letterSpacing:"2px",marginBottom:6}}>WELCOME TO</div>
              <div style={{fontSize:24,fontWeight:900,color:"#f0e8d8",fontFamily:"Georgia,serif",marginBottom:6}}>Build Your Muscles</div>
              <div style={{fontSize:13,color:"#555",lineHeight:1.7,marginBottom:16}}>Your AI-powered life transformation platform — fitness, mindset, daily planning and more. All in one place.</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <button onClick={()=>setTab(plan?"plan":"profile")} style={{padding:"12px 22px",borderRadius:10,background:GOLD,color:"#080808",fontSize:14,fontWeight:700}}>{plan?"View My Plan →":"Start Your Journey →"}</button>
                <button onClick={()=>setTab("daily")} style={{padding:"12px 18px",borderRadius:10,background:"transparent",border:`1px solid ${GOLD}33`,color:GOLD,fontSize:14}}>Daily Planner</button>
              </div>
            </div>
          </div>

          <WaterTracker/>

          {/* Feature Grid */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {[
              ["🏋️","Workout Splits","PPL, Upper/Lower, Bro Split, HIIT and more"],
              ["🍽️","Detailed Diet","Exact grams, food swaps & grocery list"],
              ["📅","Daily Planner","Build your perfect day with habit tracking"],
              ["😴","Sleep Tracker","Track and improve your sleep routine"],
              ["📚","Fitness 101","Complete beginner guide — start here!"],
              ["🏆","Achievements","Earn badges as you hit your goals"],
              ["🤖","AI Coach","Ask anything about fitness and health"],
              ["📊","Progress","BMI chart and weekly body stats"],

                <div style={{fontSize:13,fontWeight:700,color:"#d0c8bc",marginBottom:3,fontFamily:"Georgia,serif"}}>{t}</div>
                <div style={{fontSize:11,color:"#333",lineHeight:1.5}}>{d}</div>
              </GCard>

          </div>

          <div style={{borderTop:"1px solid #111",paddingTop:14,display:"flex",alignItems:"center",gap:12}}>
            <CrossIcon/>
            <div style={{fontSize:12,color:"#444",fontFamily:"Georgia,serif",fontStyle:"italic"}}>"{QUOTES[(qIdx+5)%QUOTES.length].q}"</div>
          </div>
        </div>
      )}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>

            {bmi&&<div style={{display:"flex",alignItems:"center",gap:14,padding:"12px",background:"#080808",borderRadius:10,border:"1px solid #1a1a1a"}}>

          <GCard style={{marginBottom:12}}>

            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {WORKOUT_TYPES.map(w=>(
                <div key={w.id} onClick={()=>setP("workoutType",w.id)} style={{padding:"12px 14px",borderRadius:12,border:`1px solid ${profile.workoutType===w.id?GOLD+"55":"#1a1a1a"}`,background:profile.workoutType===w.id?"#0d0900":"#0a0a0a",cursor:"pointer",transition:"all .2s"}}>
                  <div style={{fontSize:14,fontWeight:700,color:profile.workoutType===w.id?GOLD:"#aaa",marginBottom:3}}>{w.name}</div>
                  <div style={{fontSize:12,color:"#444",lineHeight:1.4}}>{w.desc}</div>
                </div>
              ))}
            </div>
            <GoldLabel>YOUR GOAL</GoldLabel>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{GOALS.map(g=><Tag key={g} label={g} active={profile.goal===g} onClick={()=>setP("goal",g)}/>)}</div>
          </GCard>

          {/* Body Type Section with Quiz */}
          <GCard style={{marginBottom:12}}>
            <GoldLabel>BODY TYPE</GoldLabel>
            {!profile.showQuiz?(
              <>
                <div style={{display:"flex",gap:10,marginBottom:12}}>
                  {Object.entries(btExamples).map(([key,bt])=>(
                    <div key={key} style={{flex:1,padding:"12px 8px",borderRadius:12,textAlign:"center",cursor:"pointer",border:`1px solid ${profile.currentType===key||profile.targetType===key?GOLD+"44":"#1a1a1a"}`,background:profile.currentType===key||profile.targetType===key?"#0d0900":"#0a0a0a",transition:"all .2s"}}
                      onClick={()=>{if(profile.currentType!==key)setP("currentType",key);else setP("targetType",key);}}>
                      <div style={{fontSize:22,marginBottom:6}}>{bt.icon}</div>
                      <div style={{fontSize:12,fontWeight:700,color:profile.currentType===key||profile.targetType===key?GOLD:"#444"}}>{bt.label}</div>
                      <div style={{fontSize:10,color:"#2a2a2a",marginTop:2}}>{bt.desc}</div>
                      {profile.currentType===key&&<div style={{fontSize:9,color:GOLD,marginTop:5}}>CURRENT</div>}
                      {profile.targetType===key&&profile.currentType!==key&&<div style={{fontSize:9,color:"#917a36",marginTop:5}}>TARGET</div>}
                    </div>
                  ))}
                </div>
                <div style={{background:"#111",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
                  <div style={{fontSize:11,color:GOLD,marginBottom:6}}>💡 What is {btExamples[profile.currentType]?.label}?</div>
                  <div style={{fontSize:12,color:"#777",lineHeight:1.5,marginBottom:6}}>{btExamples[profile.currentType]?.example}</div>
                  <div style={{fontSize:12,color:"#5a8a5a",lineHeight:1.5}}>✓ Your tip: {btExamples[profile.currentType]?.tip}</div>
                </div>
                <button onClick={()=>setP("showQuiz",true)} style={{padding:"10px 18px",borderRadius:10,background:"transparent",border:`1px solid ${GOLD}33`,color:GOLD,fontSize:13}}>Not sure? Take the Body Type Quiz →</button>
              </>
            ):(
              <BodyTypeQuiz onResult={(type)=>{setP("currentType",type);setP("showQuiz",false);}}/>
            )}
          </GCard>

          <GCard style={{marginBottom:12}}>
            <GoldLabel>DIET PREFERENCE</GoldLabel>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>{DIETS.map(d=><Tag key={d} label={d} active={profile.dietPref===d} onClick={()=>setP("dietPref",d)}/>)}</div>
            <GoldLabel>DIETARY RESTRICTIONS</GoldLabel>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{["None","Vegetarian","Vegan","Gluten-Free","Dairy-Free","Halal","Kosher","Nut Allergy"].map(r=><Tag key={r} label={r} active={profile.restriction===r} color="#6aa6cc" onClick={()=>setP("restriction",r)}/>)}</div>
          </GCard>

          <GCard style={{marginBottom:20,border:profile.condition!=="None"?"1px solid #1a3a5a":"1px solid #1a1a1a"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <span style={{fontSize:16}}>🩺</span><span style={{fontSize:10,color:"#444",letterSpacing:"1.5px"}}>HEALTH CONDITIONS</span>
              {profile.condition!=="None"&&<span style={{fontSize:9,background:"#6aa6cc20",color:"#6aa6cc",padding:"3px 10px",borderRadius:10,marginLeft:"auto"}}>PLAN ADAPTED</span>}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{CONDITIONS.map(c=><Tag key={c} label={c} active={profile.condition===c} color="#6aa6cc" onClick={()=>setP("condition",c)}/>)}</div>
          </GCard>

          <button onClick={generatePlan} disabled={loading} style={{width:"100%",padding:18,borderRadius:14,background:loading?"#1a1100":GOLD,color:loading?GOLD:"#080808",fontSize:16,fontWeight:800,letterSpacing:"0.5px",fontFamily:"Georgia,serif",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all .25s"}}>
            {loading?<><Spin/> {loadMsg}</>:<><CrossIcon/> Generate My Personalised Plan</>}
          </button>
        </div>
      )}

      {/* ===== PLAN ===== */}
      {tab==="plan"&&(
        <div className="fade-up">
          {!plan?(
            <div style={{textAlign:"center",padding:"60px 20px"}}>
              <div style={{fontSize:48,marginBottom:14}}>📋</div>
              <div style={{color:"#444",fontFamily:"Georgia,serif",fontSize:16,marginBottom:18}}>No plan yet — complete your profile first!</div>
              <button onClick={()=>setTab("profile")} style={{padding:"14px 28px",borderRadius:12,background:GOLD,color:"#080808",fontSize:15,fontWeight:700}}>Complete Your Profile →</button>
            </div>
          ):(
            <>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:9,color:GOLD,letterSpacing:"2px",marginBottom:6}}>YOUR PERSONALISED PLAN</div>
                <h1 style={{fontSize:22,fontWeight:800,color:"#f0e8d8",fontFamily:"Georgia,serif"}}>{profile.name?"For "+profile.name+" 👋":"Your Fitness Plan"}</h1>
                <p style={{color:"#555",fontSize:13,marginTop:6,lineHeight:1.7}}>{plan.summary}</p>
              </div>

              {plan.conditionNote&&plan.conditionNote.length>4&&<div style={{background:"#060d14",border:"1px solid #1a3a5a",borderRadius:12,padding:"13px 17px",marginBottom:14}}><div style={{fontSize:9,color:"#6aa6cc",letterSpacing:"1.5px",marginBottom:5}}>🩺 CONDITION NOTE</div><div style={{fontSize:12,color:"#5a8aaa",lineHeight:1.7}}>{plan.conditionNote}</div></div>}

              {/* Macros */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14}}>
                {[["🔥","CALORIES",plan.calories,"kcal/day"],["🥩","PROTEIN",plan.protein+"g","per day"],["🌾","CARBS",plan.carbs+"g","per day"],["🥑","FAT",plan.fat+"g","per day"]].map(([ic,lb,v,sub])=>(
                  <div key={lb} style={{background:"#0a0a0a",border:"1px solid #1a1a1a",borderRadius:12,padding:"14px 12px",textAlign:"center"}}>
                    <div style={{fontSize:20,marginBottom:5}}>{ic}</div>
                    <div style={{fontSize:9,color:"#444",letterSpacing:"1px",marginBottom:3}}>{lb}</div>
                    <div style={{fontSize:22,fontWeight:900,color:GOLD,fontFamily:"Georgia,serif"}}>{v}</div>
                    <div style={{fontSize:11,color:"#333",marginTop:2}}>{sub}</div>
                  </div>
                ))}
              </div>

              {/* Protein foods */}
              {plan.proteinFoods&&<GCard style={{marginBottom:14}}>
                <div style={{fontSize:10,color:GOLD,letterSpacing:"1.5px",marginBottom:8}}>🥩 BEST PROTEIN SOURCES FOR YOU</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{plan.proteinFoods.split(",").map(f=><span key={f} style={{padding:"6px 12px",background:"#111",borderRadius:20,fontSize:12,color:"#888",border:"1px solid #222"}}>{f.trim()}</span>)}</div>
              </GCard>}

              {/* Diet note */}
              {plan.dietTypeNote&&<GCard hi style={{marginBottom:14}}><div style={{fontSize:9,color:GOLD,letterSpacing:"1.5px",marginBottom:6}}>🍽 {profile.dietPref?.toUpperCase()}</div><div style={{fontSize:13,color:"#777",lineHeight:1.65}}>{plan.dietTypeNote}</div></GCard>}

              {/* Grocery List */}
              {plan.groceryList&&plan.groceryList.length>0&&<GCard style={{marginBottom:14}}>
                <div style={{fontSize:10,color:GOLD,letterSpacing:"1.5px",marginBottom:10}}>🛒 WEEKLY GROCERY LIST</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {plan.groceryList.map((item,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#888"}}>
                      <span style={{color:GOLD}}>✓</span>{item}
                    </div>
                  ))}
                </div>
              </GCard>}

              {/* Week tabs */}
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                {["plan","weekb"].map(t=>(
                  <button key={t} onClick={()=>setSubTab(t)} style={{padding:"8px 18px",borderRadius:10,background:subTab===t?GOLD:"#111",color:subTab===t?"#080808":"#555",fontSize:13,fontWeight:subTab===t?700:400,border:`1px solid ${subTab===t?GOLD:"#222"}`,transition:"all .2s"}}>
                    {t==="plan"?"Week A (Current)":weekB?"Week B (Next Week)":"Week B Loading..."}
                  </button>
                ))}
              </div>

              <div style={{fontSize:9,color:"#444",letterSpacing:"2px",marginBottom:12}}>7-DAY WORKOUT AND DIET PLAN — TAP TO EXPAND</div>
              {(subTab==="plan"?plan:weekB||plan).weekPlan?.map((d,i)=><DayCard key={i} day={d} weekLabel={subTab==="weekb"?"WEEK B":null}/>)}
            </>
          )}
        </div>
      )}

      {/* ===== DAILY PLANNER ===== */}
      {tab==="daily"&&(
        <div className="fade-up">
          {/* Sub tabs */}
          <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
            {[["habits","📅 Daily Habits"],["progress","📈 Progress"],["achievements","🏆 Achievements"]].map(([t,lb])=>(
              <button key={t} onClick={()=>setSubTab(t)} style={{padding:"8px 14px",borderRadius:10,background:subTab===t?GOLD:"#111",color:subTab===t?"#080808":"#555",fontSize:13,fontWeight:subTab===t?700:400,border:`1px solid ${subTab===t?GOLD:"#222"}`,whiteSpace:"nowrap",flexShrink:0}}>
                {lb}
              </button>
            ))}
          </div>
          {(subTab==="habits"||subTab==="plan")&&<HabitTracker/>}
          {subTab==="progress"&&(
            <div>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:9,color:GOLD,letterSpacing:"2px",marginBottom:6}}>TRACK YOUR JOURNEY</div>
                <h1 style={{fontSize:22,fontWeight:800,color:"#f0e8d8",fontFamily:"Georgia,serif"}}>Body Progress</h1>
              </div>
              <BMIChart updates={updates} currentBMI={bmi}/>
              <GCard style={{marginBottom:14}}>
                <GoldLabel>LOG THIS WEEK</GoldLabel>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                  <div><label style={{fontSize:11,color:"#444",display:"block",marginBottom:5}}>WEIGHT (kg)*</label><input type="number" placeholder="e.g. 74" value={upForm.weight} onChange={e=>setUpForm(f=>({...f,weight:e.target.value}))}/></div>
                  <div><label style={{fontSize:11,color:"#444",display:"block",marginBottom:5}}>WAIST (cm)</label><input type="number" placeholder="optional" value={upForm.waist} onChange={e=>setUpForm(f=>({...f,waist:e.target.value}))}/></div>
                  <div><label style={{fontSize:11,color:"#444",display:"block",marginBottom:5}}>ENERGY</label><select value={upForm.energy} onChange={e=>setUpForm(f=>({...f,energy:e.target.value}))}><option>Low</option><option>Medium</option><option>High</option></select></div>
                  <div><label style={{fontSize:11,color:"#444",display:"block",marginBottom:5}}>WORKOUT DAYS</label><input type="number" min="0" max="7" placeholder="e.g. 5" value={upForm.days} onChange={e=>setUpForm(f=>({...f,days:e.target.value}))}/></div>
                </div>
                <button onClick={saveUpdate} style={{width:"100%",padding:"14px",borderRadius:12,background:GOLD,color:"#080808",fontSize:15,fontWeight:700}}>Save This Week</button>

                  <div key={l} style={{background:"#0a0a0a",border:"1px solid #1a1a1a",borderRadius:12,padding:"12px",textAlign:"center"}}>
                    <div style={{fontSize:9,color:"#444",letterSpacing:"1px",marginBottom:4}}>{l.toUpperCase()}</div>
                    <div style={{fontSize:20,fontWeight:900,color:GOLD,fontFamily:"Georgia,serif"}}>{v}</div>
                  </div>
                ))}
              </div>}
              {updates.length===0?<div style={{textAlign:"center",padding:"40px",color:"#222",fontFamily:"Georgia,serif"}}>Log your first week above.</div>:(
                <div>
                  <div style={{fontSize:9,color:"#444",letterSpacing:"2px",marginBottom:10}}>HISTORY</div>
                  {[...updates].reverse().map((u,i)=>{
                    const rev=[...updates].reverse();const prev=i<rev.length-1?rev[i+1]:null;
                    const diff=prev?+(u.weight-prev.weight).toFixed(1):null;
                    return(
                      <div key={i} style={{background:"#0d0d0d",border:"1px solid #161616",borderRadius:12,padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:11,color:"#2a2a2a",marginBottom:4}}>{u.date}</div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
                            <span style={{fontSize:20,fontWeight:900,color:GOLD,fontFamily:"Georgia,serif"}}>{u.weight}kg</span>
                            {u.waist&&<span style={{fontSize:12,color:"#444"}}>Waist {u.waist}cm</span>}
                            <span style={{fontSize:12,color:"#444"}}>Energy: {u.energy}</span>
                            {u.days&&<span style={{fontSize:12,color:"#444"}}>{u.days}/7 days</span>}
                          </div>
                        </div>
                        {diff!==null&&<div style={{textAlign:"center",minWidth:50}}>
                          <div style={{fontSize:15,fontWeight:900,fontFamily:"Georgia,serif",color:diff<0?"#6aaa3a":diff>0?"#E24B4A":"#555"}}>{diff>0?"+":""}{diff}kg</div>
                          <div style={{fontSize:9,color:"#2a2a2a"}}>VS PREV</div>
                        </div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          {subTab==="achievements"&&<Achievements plan={plan} updates={updates} chatCount={chatCount}/>}
        </div>
      )}

      {/* ===== MORE ===== */}
      {tab==="more"&&(
        <div className="fade-up">
          <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
            {[["guide","📚 Fitness 101"],["water","💧 Water"],["chat","🤖 AI Coach"]].map(([t,lb])=>(
              <button key={t} onClick={()=>setSubTab(t)} style={{padding:"8px 14px",borderRadius:10,background:subTab===t?GOLD:"#111",color:subTab===t?"#080808":"#555",fontSize:13,fontWeight:subTab===t?700:400,border:`1px solid ${subTab===t?GOLD:"#222"}`,whiteSpace:"nowrap",flexShrink:0}}>{lb}</button>
            ))}
          </div>

          {subTab==="guide"&&<BeginnerGuide/>}

          {subTab==="water"&&(
            <div>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:9,color:GOLD,letterSpacing:"2px",marginBottom:6}}>STAY HYDRATED</div>
                <h1 style={{fontSize:22,fontWeight:800,color:"#f0e8d8",fontFamily:"Georgia,serif"}}>Water Tracker</h1>
              </div>
              <WaterTracker/>
              <GCard>
                <GoldLabel>HYDRATION TIPS</GoldLabel>
                {[["Drink first thing","Have 1 full glass of water the moment you wake up every morning."],["Pre-workout","Drink 500ml water 30 minutes before every workout."],["During workout","Sip water every 15 minutes during exercise."],["With meals","Drink a glass of water with every meal to aid digestion."],["Dehydration signs","Headache, fatigue, dark yellow urine — drink more water!"]].map(([t,d])=>(
                  <div key={t} style={{display:"flex",gap:10,marginBottom:10}}>
                    <span style={{color:GOLD,flexShrink:0}}>💧</span>
                    <div><div style={{fontSize:13,color:"#ccc",fontWeight:600,marginBottom:2}}>{t}</div><div style={{fontSize:12,color:"#555",lineHeight:1.5}}>{d}</div></div>
                  </div>
                ))}
              </GCard>
            </div>
          )}

          {subTab==="chat"&&(
            <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)"}}>
              <div style={{marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><CrossIcon/><div style={{fontSize:9,color:GOLD,letterSpacing:"2px"}}>MEL MIRACLE AI COACH</div></div>
                <h1 style={{fontSize:20,fontWeight:800,color:"#f0e8d8",fontFamily:"Georgia,serif"}}>Ask Me Anything</h1>
                <p style={{fontSize:11,color:"#333",marginTop:3}}>Fitness, diet, sleep, mindset — I am here to help!</p>
              </div>
              <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,paddingBottom:14}}>
                {msgs.map((m,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                    {m.role==="ai"&&<div style={{width:32,height:32,borderRadius:"50%",background:"#0d0900",border:`1px solid ${GOLD}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,marginRight:8,flexShrink:0,marginTop:2}}>💪</div>}
                    <div style={{maxWidth:"80%",padding:"12px 16px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"4px 16px 16px 16px",background:m.role==="user"?GOLD:"#0f0f0f",color:m.role==="user"?"#080808":"#c8c0b4",fontSize:14,lineHeight:1.7,border:m.role==="ai"?"1px solid #1a1a1a":"none",whiteSpace:"pre-wrap"}}>
                      {m.text||<Spin/>}
                    </div>
                  </div>
                ))}
                <div ref={chatEndRef}/>
              </div>
              <div style={{borderTop:"1px solid #111",paddingTop:12,display:"flex",gap:8}}>
                <input value={chatIn} onChange={e=>setChatIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendChat()} placeholder="Ask about workouts, diet, sleep, mindset..." style={{flex:1}}/>
                <button onClick={sendChat} disabled={chatLoad||!chatIn.trim()} style={{padding:"12px 18px",borderRadius:10,fontWeight:700,fontSize:14,transition:"all .2s",background:chatLoad||!chatIn.trim()?"#111":GOLD,color:chatLoad||!chatIn.trim()?"#333":"#080808"}}>
                  {chatLoad?<Spin/>:"Send"}
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
